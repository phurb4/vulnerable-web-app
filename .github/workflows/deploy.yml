name: DevSecOps Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scan (Betterleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Buscar claves expuestas
        continue-on-error: true
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            ghcr.io/betterleaks/betterleaks:v1.9.0 \
            dir . --redact --report-format sarif --report-path betterleaks.sarif

      - name: Subir hallazgos a la pestana Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: betterleaks.sarif
          category: betterleaks

      - name: Guardar el reporte como archivo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reporte-betterleaks
          path: betterleaks.sarif

  sast-codeql:
    name: SAST (CodeQL)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Preparar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analizar el codigo
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql

  sast-semgrep:
    name: SAST (Semgrep)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Analizar el codigo con Semgrep
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            semgrep/semgrep semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/javascript \
            --metrics=off \
            --sarif --output=semgrep.sarif

      - name: Subir hallazgos a la pestana Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Guardar el reporte como archivo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reporte-semgrep
          path: semgrep.sarif

  sca-snyk:
    name: SCA (Snyk)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Usar un solo archivo de versiones (solo en la copia temporal)
        run: mv npm-shrinkwrap.json package-lock.json

      - name: Analizar las librerias con Snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Subir hallazgos a la pestana Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
          category: snyk

      - name: Guardar el reporte como archivo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reporte-snyk
          path: snyk.sarif

  dast-zap:
    name: DAST (OWASP ZAP)
    needs: [sast-codeql, sast-semgrep, sca-snyk]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Construir la imagen con el Dockerfile
        run: docker build -t app-prueba .

      - name: Levantar la app en un entorno de prueba temporal
        run: |
          docker run -d --name app -p 8080:8080 app-prueba
          for intento in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "La app esta respondiendo"
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Preparar la carpeta del reporte
        run: |
          mkdir zap-report
          chmod 777 zap-report

      - name: Analizar la app de prueba con ZAP
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/zap-report:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8080 \
            -r reporte-zap.html -J reporte-zap.json -I

      - name: Guardar el reporte como archivo
        uses: actions/upload-artifact@v6
        with:
          name: reporte-zap
          path: zap-report/
          if-no-files-found: error
