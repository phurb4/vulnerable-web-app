name: DevSecOps Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scan (Betterleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6

      - name: Buscar claves expuestas
        continue-on-error: true
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            ghcr.io/betterleaks/betterleaks:v1.9.0 \
            dir . --redact --report-format sarif --report-path betterleaks.sarif

      - name: Subir hallazgos a la pestana Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: betterleaks.sarif
          category: betterleaks

      - name: Guardar el reporte como archivo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reporte-betterleaks
          path: betterleaks.sarif
